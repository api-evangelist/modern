name: Modern
description: >-
  Modern (modernis.com) is a two-way customer interaction platform for heavy-equipment
  dealerships, unifying service communications "from intake to invoice" across construction,
  agriculture, mining, landscaping, and material-handling sectors. It provides two-way text
  and email messaging, digital repair-order approvals, inspection and warranty documentation,
  outbound maintenance scheduling, rental tracking, parts-order status, and DMS integration.
  The MODERN Partner API (docs.modernis.com, base https://connect.modernis.com) lets authorized
  integrators read dealership dashboards, manage service work orders, post work-order events,
  send customer notifications, and maintain technicians and notes on a franchise's behalf using
  24-hour bearer tokens exchanged from franchise credentials.
